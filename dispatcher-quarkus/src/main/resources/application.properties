quarkus.http.port=8080

# Stork — Consul service discovery
quarkus.stork.band-service.service-discovery.type=consul
quarkus.stork.band-service.service-discovery.consul-host=${CONSUL_HOST:localhost}
quarkus.stork.band-service.service-discovery.consul-port=${CONSUL_PORT:8500}
quarkus.stork.band-service.service-discovery.refresh-period=10S

# Stork — Load balancer (change to: random, least-requests, power-of-two-choices, least-response-time, sticky)

# Random:
#quarkus.stork.band-service.load-balancer.type=random

# Least-Requests:
#quarkus.stork.band-service.load-balancer.type=least-requests

# Power of Two Random Choices:
#quarkus.stork.band-service.load-balancer.type=power-of-two-choices

# Least Response time:
#quarkus.stork.band-service.load-balancer.type=least-response-time

#quarkus.stork.band-service.load-balancer.type=custom-load-balancer

#quarkus.micrometer.binder.stork.enabled=false

# Observability
quarkus.micrometer.binder.stork.enabled=true
